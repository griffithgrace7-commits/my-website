<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2048 Game</title>
<style>
  body {
    font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    background: #faf8ef;
    color: #776e65;
  }

  h1 {
    font-size: 80px;
    margin: 20px 0;
  }

  #game {
    width: 400px;
    height: 400px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    background: #bbada0;
    padding: 10px;
    border-radius: 10px;
    position: relative;
  }

  .tile {
    width: 100%;
    height: 100%;
    background: #cdc1b4;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    font-weight: bold;
    border-radius: 5px;
    color: white;
  }

  /* Specific text color for lighter backgrounds to keep it readable */
  .tile-2, .tile-4, .tile-8, .tile-32, .tile-128 {
    color: #776e65;
  }

  /* Updated Color Palette */
  .tile-2    { background: #E0BBE4; } /* Purple */
  .tile-4    { background: #957dad; } /* Blue */
  .tile-8    { background: #AEEEEE; } /* Turquoise */
  .tile-16   { background: #98fb98; } /* Green */
  .tile-32   { background: #ffeb3b; } /* Yellow */
  .tile-64   { background: #ff9800; } /* Distinct Orange */
  .tile-128  { background: #ffdab9; } /* Distinct Peach */
  .tile-256  { background: #ffb7ce; } /* Pink (Swapped) */
  .tile-512  { background: #ff6961; } /* Red (Swapped) */
  .tile-1024 { background: #8b0000; } /* Dark Red */
  .tile-2048 { background: #000000; color: white; } /* Black */

</style>
</head>
<body>

<h1>2048</h1>
<div id="game"></div>

<script>
  const game = document.getElementById("game");
  let grid = [];
  let won = false;

  const colorMap = {
    2: "tile-2", 4: "tile-4", 8: "tile-8", 16: "tile-16",
    32: "tile-32", 64: "tile-64", 128: "tile-128", 256: "tile-256",
    512: "tile-512", 1024: "tile-1024", 2048: "tile-2048"
  };

  function init() {
    grid = Array(4).fill().map(() => Array(4).fill(0));
    won = false;
    addNumber();
    addNumber();
    draw();
  }

  function draw() {
    game.innerHTML = "";
    grid.forEach(row => {
      row.forEach(cell => {
        const div = document.createElement("div");
        div.classList.add("tile");
        if (cell > 0) {
          div.textContent = cell;
          div.classList.add(colorMap[cell] || "tile-2048");
        }
        game.appendChild(div);
      });
    });
  }

  function addNumber() {
    let empty = [];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (grid[r][c] === 0) empty.push({r, c});
      }
    }
    if (empty.length === 0) return;
    let spot = empty[Math.floor(Math.random() * empty.length)];
    grid[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
  }

  function slide(row) {
    row = row.filter(v => v);
    for (let i = 0; i < row.length - 1; i++) {
      if (row[i] === row[i+1]) {
        row[i] *= 2;
        row[i+1] = 0;
        if (row[i] === 2048 && !won) {
            won = true;
            setTimeout(() => alert("You Win! 2048!"), 100);
        }
      }
    }
    return row.filter(v => v).concat(Array(4 - row.filter(v => v).length).fill(0));
  }

  function rotate() {
    grid = grid[0].map((_, i) => grid.map(row => row[i])).reverse();
  }

  function moveLeft() {
    let oldGrid = JSON.stringify(grid);
    grid = grid.map(row => slide(row));
    return oldGrid !== JSON.stringify(grid);
  }

  function checkGameOver() {
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            if (grid[r][c] === 0) return false;
        }
    }
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            if (c < 3 && grid[r][c] === grid[r][c+1]) return false;
            if (r < 3 && grid[r][c] === grid[r+1][c]) return false;
        }
    }
    return true;
  }

  function move(direction) {
    for (let i = 0; i < direction; i++) rotate();
    let changed = moveLeft();
    for (let i = 0; i < (4 - direction) % 4; i++) rotate();

    if (changed) {
        addNumber();
        draw();
        if (checkGameOver()) {
            setTimeout(() => alert("Game Over! No more moves."), 100);
        }
    }
  }

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") move(0);
    if (e.key === "ArrowUp") move(1);
    if (e.key === "ArrowRight") move(2);
    if (e.key === "ArrowDown") move(3);
  });

  init();
</script>

<a href ="index.html">Back to Home</a>

</body>
</html>
